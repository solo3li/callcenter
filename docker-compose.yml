version: '3.8'
services:
  asterisk:
    build: ./asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10050:10000-10050/udp"
    restart: always
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf
    depends_on:
      - livekit-sip

  redis:
    image: redis:7-alpine
    restart: always

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command: --dev --redis-host redis:6379 --node-ip 127.0.0.1 --bind 0.0.0.0
    restart: always
    depends_on:
      - redis

  livekit-sip:
    image: livekit/sip:latest
    command: --config /sip/config.yaml
    environment:
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - SIP_PORT=5061
    volumes:
      - ./livekit-sip.yaml:/sip/config.yaml
    restart: always
    depends_on:
      - livekit

  backend:
    build: ./backend
    restart: always

  python-ai-worker:
    build:
      context: ./python-ai-worker
      dockerfile: Dockerfile
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - GEMINI_API_KEY=YOUR_GEMINI_API_KEY
      - GOOGLE_API_KEY=YOUR_GEMINI_API_KEY
    restart: always
    depends_on:
      - livekit

  caddy:
    image: caddy:alpine
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
