<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <a href="/admin.html" class="btn btn-secondary mb-3">&larr; Back to Dashboard</a>
        
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Call Details</h4>
            </div>
            <div class="card-body" id="details-content">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('roomName');

        async function fetchDetails() {
            if (!roomName) {
                document.getElementById('details-content').innerHTML = '<div class="alert alert-danger">No room specified</div>';
                return;
            }

            try {
                const res = await fetch('/api/calls');
                const calls = await res.json();
                const call = calls.find(c => c.roomName === roomName);
                
                if (!call) {
                    document.getElementById('details-content').innerHTML = '<div class="alert alert-danger">Call not found</div>';
                    return;
                }

                let html = `
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Room Name:</strong> ${call.roomName}<br>
                            <strong>Caller ID:</strong> ${call.callerId}<br>
                            <strong>Start Time:</strong> ${new Date(call.startTime).toLocaleString()}<br>
                            <strong>End Time:</strong> ${call.endTime ? new Date(call.endTime).toLocaleString() : '<em>Not ended</em>'}<br>
                        </div>
                        <div class="col-md-6">
                            <strong>Status:</strong> <span class="badge bg-${call.status === 'Active' ? 'success' : (call.status === 'Transferred' ? 'warning text-dark' : 'secondary')}">${call.status}</span><br>
                            <strong>Handled By Agent ID:</strong> ${call.handledByAgentId || 'AI Only'}<br>
                        </div>
                    </div>
                `;

                if (call.recordingUrl) {
                    html += `
                        <hr>
                        <h5>🎙️ Recording</h5>
                        <video controls style="width: 100%; max-height: 200px;" class="mb-3">
                            <source src="${call.recordingUrl}" type="video/webm">
                            Your browser does not support the video tag.
                        </video>
                        <a href="${call.recordingUrl}" target="_blank" class="btn btn-sm btn-outline-primary">Download File</a>
                    `;
                }

                if (call.summary) {
                    html += `
                        <hr>
                        <h5>📄 AI Summary</h5>
                        <div class="p-3 bg-white border rounded">
                            ${call.summary}
                        </div>
                    `;
                }

                document.getElementById('details-content').innerHTML = html;
            } catch (err) {
                console.error(err);
                document.getElementById('details-content').innerHTML = '<div class="alert alert-danger">Error loading details</div>';
            }
        }

        fetchDetails();
    </script>
</body>
</html>
