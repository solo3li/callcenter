version: '3.8'
services:
  asterisk:
    build: ./asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10050:10000-10050/udp"
    restart: always
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf
    depends_on:
      - livekit-sip

  redis:
    image: redis:7-alpine
    restart: always

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command: --dev --node-ip 127.0.0.1 --bind 0.0.0.0
    environment:
      - LIVEKIT_KEYS=devkey: secret
      - LIVEKIT_REDIS=redis:6379
    restart: always
    depends_on:
      - redis

  livekit-sip:
    image: livekit/sip:latest
    command: --config /sip/config.yaml
    environment:
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - SIP_PORT=5061
    volumes:
      - ./livekit-sip.yaml:/sip/config.yaml
    restart: always
    depends_on:
      - livekit

  backend:
    build: ./backend
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=callcenter;Username=admin;Password=adminpassword
      - JWT_SECRET=change-this-in-production-use-a-strong-random-key
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - REDIS_CONNECTION=redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=adminpassword
      - MINIO_BUCKET=recordings
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - recordings_data:/app/wwwroot/recordings
    restart: always
    depends_on:
      - db

  python-ai-worker:
    build:
      context: ./python-ai-worker
      dockerfile: Dockerfile
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - GEMINI_API_KEY=YOUR_GEMINI_API_KEY
      - GOOGLE_API_KEY=YOUR_GEMINI_API_KEY
      - PERSONA_ID=
      - BACKEND_URL=http://backend:5000
      - AGENT_VOICE=Aoede
      - AGENT_TEMPERATURE=0.7
    restart: always
    depends_on:
      - livekit

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: callcenter
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data

  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    restart: always
    volumes:
      - recordings_data:/recordings
    depends_on:
      - livekit
      - redis

  caddy:
    image: caddy:alpine
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
  recordings_data: