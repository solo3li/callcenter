services:
  redis:
    image: redis:7-alpine
    restart: always

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882-7892:7882-7892/udp"
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml
    restart: always
    depends_on:
      - redis

  livekit-sip:
    image: livekit/sip:latest
    command: --config /sip/config.yaml
    environment:
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - SIP_PORT=5061
    ports:
      - "5061:5061/udp"
      - "5061:5061/tcp"
    volumes:
      - ./livekit-sip.yaml:/sip/config.yaml
    restart: always
    depends_on:
      - livekit
      - redis

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=callcenter;Username=admin;Password=adminpassword
      - JWT_SECRET=change-this-in-production-use-a-strong-random-key
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - REDIS_CONNECTION=redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=adminpassword
      - MINIO_BUCKET=recordings
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8081
      - BACKEND_SERVICE_TOKEN=${BACKEND_SERVICE_TOKEN:-}
    volumes:
      - recordings_data:/app/wwwroot/recordings
    restart: always
    depends_on:
      - db
      - livekit

  python-ai-worker:
    build:
      context: ./python-ai-worker
      dockerfile: Dockerfile
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - GEMINI_API_KEY=YOUR_GEMINI_API_KEY
      - GOOGLE_API_KEY=YOUR_GEMINI_API_KEY
      - AGENT_NAME=voice-agent
      - PERSONA_ID=
      - BACKEND_URL=http://backend:5000
      - BACKEND_SERVICE_TOKEN=${BACKEND_SERVICE_TOKEN:-}
      - AGENT_VOICE=Aoede
      - AGENT_TEMPERATURE=0.7
    restart: always
    depends_on:
      - livekit
      - backend

  # One-shot bootstrap: creates the SIP inbound trunk, dispatch rule and
  # outbound trunk against the running LiveKit. Run with:
  #   PBX_IP=1.2.3.4 OWNER_USER_ID=<user-guid> \
  #   docker compose --profile setup run --rm sip-setup
  sip-setup:
    build:
      context: ./python-ai-worker
      dockerfile: Dockerfile
    profiles: ["setup"]
    environment:
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - PBX_IP=${PBX_IP:?set PBX_IP to your customer PBX address}
      - SIP_DIDS=${SIP_DIDS:-}
      - OWNER_USER_ID=${OWNER_USER_ID:?set OWNER_USER_ID to the owning users.id}
    volumes:
      - ./sip-setup.py:/setup/sip-setup.py
    command: python /setup/sip-setup.py
    depends_on:
      - livekit

  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: callcenter
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data

  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    restart: always
    volumes:
      - recordings_data:/recordings
    depends_on:
      - livekit
      - redis

  caddy:
    image: caddy:alpine
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
  recordings_data:
